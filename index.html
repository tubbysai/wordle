<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FaithWord — A Bible-inspired word puzzle</title>
<style>
/* ============================================================
   FaithWord — Stained Glass Cathedral theme
   ============================================================ */
:root{
  --bg:#0a0e1a;
  --bg2:#111733;
  --panel:rgba(22,30,58,0.55);
  --panel-border:rgba(201,168,76,0.22);
  --gold:#c9a84c;
  --gold-bright:#f0c040;
  --green:#3a7d44;
  --green-glow:#4caf50;
  --amber:#d6a23a;
  --absent:#2a2f44;
  --absent-key:#39405e;
  --text:#e8e6df;
  --muted:#9aa0b8;
  --shadow:0 8px 32px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 10%, rgba(201,168,76,0.10), transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(80,120,220,0.12), transparent 45%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  background-attachment:fixed;
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}
/* faint stained-glass lattice */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(60deg, rgba(201,168,76,0.04) 0 1px, transparent 1px 60px),
    repeating-linear-gradient(-60deg, rgba(120,140,220,0.04) 0 1px, transparent 1px 60px);
  opacity:.6;
}
.app{position:relative;z-index:1;width:100%;max-width:540px;padding:14px 12px 28px;display:flex;flex-direction:column;align-items:center;}

/* Header */
header{width:100%;text-align:center;margin-bottom:10px;}
.title{
  font-size:2.1rem;font-weight:800;letter-spacing:.06em;margin:2px 0 0;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 22px rgba(240,192,64,0.25);
}
.subtitle{font-size:.82rem;color:var(--muted);margin:2px 0 10px;letter-spacing:.04em;}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;}
.modes{display:flex;gap:4px;background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:4px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.mode-btn{
  border:none;background:transparent;color:var(--muted);font-size:.78rem;font-weight:600;
  padding:6px 9px;border-radius:8px;cursor:pointer;transition:.2s;letter-spacing:.02em;
}
.mode-btn.active{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1408;box-shadow:0 2px 10px rgba(240,192,64,0.35);}
.icon-btn{
  border:1px solid var(--panel-border);background:var(--panel);color:var(--gold);
  font-size:.78rem;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s;
}
.icon-btn:hover,.mode-btn:hover{transform:translateY(-1px);}
.icon-btn:active{transform:translateY(0);}

/* Board */
.board-wrap{margin:16px 0 8px;display:flex;justify-content:center;}
.board{display:grid;gap:7px;}
.row{display:grid;gap:7px;}
.tile{
  width:58px;height:58px;display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;font-weight:800;text-transform:uppercase;
  border:2px solid rgba(201,168,76,0.22);border-radius:8px;
  background:rgba(20,26,48,0.4);color:var(--text);
  perspective:600px;position:relative;transition:border-color .15s;
}
.tile.filled{border-color:rgba(201,168,76,0.6);animation:pop .12s ease;}
@keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.tile .face{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  border-radius:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.tile.reveal{transform-style:preserve-3d;animation:flip .55s ease forwards;}
@keyframes flip{0%{transform:rotateX(0)}45%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.tile.correct{background:linear-gradient(160deg,var(--green-glow),var(--green));border-color:var(--gold);color:#fff;box-shadow:0 0 14px rgba(76,175,80,0.4);}
.tile.present{background:linear-gradient(160deg,#e0b14a,var(--amber));border-color:#e0b14a;color:#1a1408;}
.tile.absent{background:var(--absent);border-color:var(--absent);color:#8b91a8;}
.tile.win-pulse{animation:winpulse .6s ease;}
@keyframes winpulse{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}60%{transform:translateY(2px)}}

/* responsive tile sizes per length */
.board.len4 .tile{width:62px;height:62px;font-size:2rem;}
.board.len6 .tile{width:50px;height:50px;font-size:1.6rem;}

/* Keyboard */
.keyboard{width:100%;max-width:520px;margin-top:10px;display:flex;flex-direction:column;gap:7px;}
.krow{display:flex;gap:5px;justify-content:center;}
.key{
  flex:1;min-width:0;height:52px;border:none;border-radius:8px;cursor:pointer;
  font-size:.95rem;font-weight:700;text-transform:uppercase;
  background:var(--absent-key);color:var(--text);transition:transform .08s,background .25s;
  display:flex;align-items:center;justify-content:center;
}
.key:active{transform:scale(.92);}
.key.wide{flex:1.6;font-size:.72rem;}
.key.correct{background:linear-gradient(160deg,var(--green-glow),var(--green));color:#fff;}
.key.present{background:linear-gradient(160deg,#e0b14a,var(--amber));color:#1a1408;}
.key.absent{background:#1c2138;color:#5a6082;}

/* Actions */
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;justify-content:center;}
.action-btn{
  border:1px solid var(--panel-border);background:var(--panel);color:var(--gold-bright);
  padding:9px 16px;border-radius:11px;cursor:pointer;font-weight:600;font-size:.85rem;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:.2s;
}
.action-btn:hover{transform:translateY(-1px);border-color:var(--gold);}
.hint-box{
  margin-top:12px;max-width:480px;width:100%;text-align:center;font-size:.85rem;color:var(--gold-bright);
  background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:10px 14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;
}
.hint-box.show{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}

/* Toast */
.toast{
  position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(10,14,26,0.95);border:1px solid var(--gold);color:var(--gold-bright);
  padding:11px 20px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:120;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.3s;text-align:center;max-width:90%;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(4,7,16,0.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:18px;
}
.overlay.show{display:flex;animation:fade .25s ease;}
.modal{
  width:100%;max-width:420px;background:linear-gradient(165deg,rgba(26,34,64,0.92),rgba(14,18,34,0.95));
  border:1px solid var(--gold);border-radius:18px;padding:22px;box-shadow:var(--shadow);
  position:relative;max-height:88vh;overflow-y:auto;
}
.modal h2{margin:0 0 4px;font-size:1.6rem;text-align:center;
  background:linear-gradient(180deg,var(--gold-bright),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
.modal .answer-word{text-align:center;font-size:2rem;font-weight:800;letter-spacing:.12em;margin:8px 0 2px;color:#fff;}
.modal .cat{text-align:center;color:var(--gold);font-size:.85rem;margin-bottom:10px;letter-spacing:.05em;}
.modal .verse{text-align:center;font-style:italic;color:var(--gold-bright);font-size:.9rem;margin:8px 0;}
.modal .note{font-size:.9rem;color:var(--text);line-height:1.5;background:rgba(255,255,255,0.04);padding:11px;border-radius:10px;border-left:3px solid var(--gold);}
.modal .gcount{text-align:center;color:var(--muted);font-size:.82rem;margin:12px 0 4px;}
.mini-stats{display:flex;justify-content:space-around;margin:14px 0;text-align:center;}
.mini-stats .s b{display:block;font-size:1.4rem;color:var(--gold-bright);}
.mini-stats .s span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.modal-actions{display:flex;gap:8px;margin-top:8px;}
.modal-actions button{flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;font-weight:700;font-size:.9rem;}
.btn-primary{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#1a1408;}
.btn-ghost{background:transparent;border:1px solid var(--panel-border)!important;color:var(--gold-bright);}
.close-x{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--muted);font-size:1.4rem;cursor:pointer;line-height:1;}

/* Stats distribution */
.dist{margin:14px 0;}
.dist-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:.8rem;}
.dist-row .num{width:14px;color:var(--muted);}
.dist-bar{height:20px;background:var(--gold);color:#1a1408;border-radius:4px;min-width:22px;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;font-weight:700;transition:width .4s;}
.dist-bar.cur{background:linear-gradient(90deg,var(--green-glow),var(--green));color:#fff;}

/* Sparkles */
.sparkle{position:fixed;width:8px;height:8px;border-radius:50%;background:var(--gold-bright);
  box-shadow:0 0 10px var(--gold-bright);pointer-events:none;z-index:130;opacity:0;}
@keyframes sparkleAnim{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}

@media (max-width:430px){
  .tile{width:50px;height:50px;font-size:1.7rem;}
  .board.len4 .tile{width:54px;height:54px;}
  .board.len6 .tile{width:44px;height:44px;font-size:1.4rem;}
  .key{height:46px;}
  .title{font-size:1.8rem;}
}
@media (max-width:360px){
  .tile{width:44px;height:44px;font-size:1.5rem;}
  .board.len6 .tile{width:40px;height:40px;font-size:1.2rem;}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="title">FaithWord</h1>
    <div class="subtitle">A Bible-inspired word puzzle</div>
    <div class="toolbar">
      <div class="modes" id="modes">
        <button class="mode-btn" data-mode="easy">Easy · 4</button>
        <button class="mode-btn active" data-mode="classic">Classic · 5</button>
        <button class="mode-btn" data-mode="challenge">Challenge · 6</button>
        <button class="mode-btn" data-mode="mixed">Mixed</button>
      </div>
      <button class="icon-btn" id="statsBtn">Stats</button>
      <button class="icon-btn" id="newBtn">New Game</button>
    </div>
  </header>

  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="hint-box" id="hintBox"></div>

  <div class="keyboard" id="keyboard"></div>

  <div class="actions">
    <button class="action-btn" id="hintBtn">Hint</button>
    <button class="action-btn" id="shareBtn">Share</button>
    <button class="action-btn" id="giveupBtn">Give Up</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Result Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-x" id="closeModal">&times;</button>
    <h2 id="resultTitle">Victory</h2>
    <div class="answer-word" id="resAnswer">GRACE</div>
    <div class="cat" id="resCat">Virtue</div>
    <div class="verse" id="resVerse"></div>
    <div class="note" id="resNote"></div>
    <div class="gcount" id="resCount"></div>
    <div class="mini-stats">
      <div class="s"><b id="msPlayed">0</b><span>Played</span></div>
      <div class="s"><b id="msWin">0%</b><span>Win</span></div>
      <div class="s"><b id="msCur">0</b><span>Streak</span></div>
      <div class="s"><b id="msBest">0</b><span>Best</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="shareModalBtn">Share</button>
      <button class="btn-primary" id="playAgainBtn">Play Again</button>
    </div>
  </div>
</div>

<!-- Stats Modal -->
<div class="overlay" id="statsOverlay">
  <div class="modal">
    <button class="close-x" id="closeStats">&times;</button>
    <h2>Statistics</h2>
    <div class="mini-stats">
      <div class="s"><b id="stPlayed">0</b><span>Played</span></div>
      <div class="s"><b id="stWin">0%</b><span>Win</span></div>
      <div class="s"><b id="stCur">0</b><span>Streak</span></div>
      <div class="s"><b id="stBest">0</b><span>Best</span></div>
    </div>
    <div style="text-align:center;color:var(--gold);font-size:.8rem;letter-spacing:.05em;margin-top:6px;">GUESS DISTRIBUTION</div>
    <div class="dist" id="distBox"></div>
    <div class="modal-actions"><button class="btn-primary" id="closeStats2">Close</button></div>
  </div>
</div>

// Build guess sets per length (Set of uppercase words), include answers.
const GUESS_SETS = {};
(function buildGuessSets(){
  [4,5,6].forEach(len=>{
    const set = new Set();
    GUESS_RAW[len].split(/\s+/).forEach(w=>{
      w = w.replace(/[^a-zA-Zа-яА-Я]/g,"").toUpperCase();
      if(w.length===len) set.add(w);
    });
    // include answers (trim padding spaces, only same length & A-Z)
    ANSWERS[len].forEach(o=>{
      const w = o.word.trim().toUpperCase();
      if(w.length===len && /^[A-Z]+$/.test(w)) set.add(w);
    });
    GUESS_SETS[len] = set;
  });
})();
// sanitize answer pools: only valid A-Z words of correct length
const VALID_ANSWERS = {};
[4,5,6].forEach(len=>{
  VALID_ANSWERS[len] = ANSWERS[len].filter(o=>{
    const w = o.word.trim().toUpperCase();
    return w.length===len && /^[A-Z]+$/.test(w);
  }).map(o=>({...o, word:o.word.trim().toUpperCase()}));
});

/* ============================================================
   4. QUEUE RANDOMIZATION (Fisher-Yates)
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function buildQueue(len){
  // queue of indices into VALID_ANSWERS[len]
  return shuffle(VALID_ANSWERS[len].map((_,i)=>i));
}
function nextAnswer(len){
  const queues = getQueues();
  let q = queues[len];
  if(!Array.isArray(q) || q.length===0){
    q = buildQueue(len);
  }
  // reshuffle when low (keeps variety without instant repeats)
  if(q.length < 2 && VALID_ANSWERS[len].length > 4){
    // append a fresh shuffle avoiding immediate repeat of last
    const fresh = buildQueue(len);
    q = q.concat(fresh);
  }
  const idx = q.shift();
  queues[len] = q;
  setQueues(queues);
  return VALID_ANSWERS[len][idx];
}

const boardEl = document.getElementById("board");
const keyboardEl = document.getElementById("keyboard");
const KEY_ROWS = ["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];

function renderBoard(){
  boardEl.className = "board len"+state.length;
  boardEl.style.gridTemplateColumns = "1fr";
  boardEl.innerHTML = "";
  for(let r=0;r<MAX_GUESSES;r++){
    const row = document.createElement("div");
    row.className="row";
    row.style.gridTemplateColumns = `repeat(${state.length}, auto)`;
    for(let c=0;c<state.length;c++){
      const t = document.createElement("div");
      t.className="tile";
      t.id = `tile-${r}-${c}`;
      const face = document.createElement("div");
      face.className="face";
      t.appendChild(face);
      row.appendChild(t);
    }
    boardEl.appendChild(row);
  }
  // re-render any existing guesses (used on restore-less new game it's empty)
  state.guesses.forEach((g,r)=>{
    for(let c=0;c<state.length;c++){
      const t=document.getElementById(`tile-${r}-${c}`);
      t.querySelector(".face").textContent=g.word[c];
      t.textContent=g.word[c];
      t.classList.add(g.result[c]);
    }
  });
}

function renderKeyboard(){
  keyboardEl.innerHTML="";
  KEY_ROWS.forEach((rowStr,i)=>{
    const row=document.createElement("div");
    row.className="krow";
    if(i===2){
      row.appendChild(makeKey("ENTER",true));
    }
    rowStr.split("").forEach(ch=> row.appendChild(makeKey(ch,false)));
    if(i===2){
      row.appendChild(makeKey("DEL",true));
    }
    keyboardEl.appendChild(row);
  });
}
function makeKey(label,wide){
  const b=document.createElement("button");
  b.className="key"+(wide?" wide":"");
  b.textContent = label==="DEL" ? "Back" : label;
  b.dataset.key=label;
  b.addEventListener("click",()=>handleKey(label));
  return b;
}
function updateTileRow(){
  const r=state.row;
  for(let c=0;c<state.length;c++){
    const t=document.getElementById(`tile-${r}-${c}`);
    if(!t) continue;
    const ch = state.current[c] || "";
    t.querySelector(".face").textContent = ch;
    t.textContent = ch ? ch : "";
    // keep face for flip; set plain text fallback
    t.classList.toggle("filled", !!ch);
  }
}

/* ============================================================
   6. INPUT HANDLING
   ============================================================ */
function handleKey(key){
  if(state.over) return;
  if(key==="ENTER"){ submitGuess(); return; }
  if(key==="DEL"){
    state.current = state.current.slice(0,-1);
    updateTileRow();
    return;
  }
  if(/^[A-Z]$/.test(key) && state.current.length < state.length){
    state.current += key;
    updateTileRow();
  }
}
document.addEventListener("keydown",e=>{
  if(document.getElementById("overlay").classList.contains("show")) return;
  if(document.getElementById("statsOverlay").classList.contains("show")) return;
  const k=e.key;
  if(k==="Enter") handleKey("ENTER");
  else if(k==="Backspace") handleKey("DEL");
  else if(/^[a-zA-Z]$/.test(k)) handleKey(k.toUpperCase());
});

/* ============================================================
   7. GUESS VALIDATION
   ============================================================ */
function isValidGuess(word){
  if(word.length < state.length) return {ok:false,msg:"Too short"};
  if(word.length > state.length) return {ok:false,msg:"Too long"};
  if(!GUESS_SETS[state.length].has(word)) return {ok:false,msg:"Not in word list"};
  return {ok:true};
}

/* ============================================================
   8. SCORING (Wordle with duplicate handling)
   ============================================================ */
function scoreGuess(guess, answer){
  const res = new Array(guess.length).fill("absent");
  const counts = {};
  for(const ch of answer) counts[ch]=(counts[ch]||0)+1;
  // first pass: correct
  for(let i=0;i<guess.length;i++){
    if(guess[i]===answer[i]){ res[i]="correct"; counts[guess[i]]--; }
  }
  // second pass: present
  for(let i=0;i<guess.length;i++){
    if(res[i]==="correct") continue;
    const ch=guess[i];
    if(counts[ch]>0){ res[i]="present"; counts[ch]--; }
  }
  return res;
}

/* ============================================================
   submit + reveal animation
   ============================================================ */
const WIN_MSGS = ["Well done","Grace found","Victory","You stayed the course","Faithful and true","Amen!","Blessed"];
function submitGuess(){
  if(state.over) return;
  const word = state.current.toUpperCase();
  const v = isValidGuess(word);
  if(!v.ok){ toast(v.msg); shakeRow(); return; }
  const result = scoreGuess(word, state.answer);
  state.guesses.push({word, result});
  const r=state.row;
  // reveal one by one
  for(let c=0;c<state.length;c++){
    const t=document.getElementById(`tile-${r}-${c}`);
    setTimeout(()=>{
      t.classList.add("reveal");
      setTimeout(()=>{
        t.querySelector(".face").textContent=word[c];
        t.textContent=word[c];
        t.classList.add(result[c]);
      },270);
    }, c*280);
  }
  const totalDelay = state.length*280 + 320;
  setTimeout(()=>{
    updateKeyboard(word,result);
    const won = result.every(x=>x==="correct");
    if(won){
      state.row++;
      finishGame(true);
    } else if(state.row+1 >= MAX_GUESSES){
      state.row++;
      finishGame(false);
    } else {
      state.row++;
      state.current="";
    }
  }, totalDelay);
  state.current="";
}
function shakeRow(){
  const r=state.row;
  for(let c=0;c<state.length;c++){
    const t=document.getElementById(`tile-${r}-${c}`);
    if(!t)continue;
    t.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:300});
  }
}
const KEY_RANK={absent:0,present:1,correct:2};
function updateKeyboard(word,result){
  for(let i=0;i<word.length;i++){
    const ch=word[i];
    const btn=keyboardEl.querySelector(`[data-key="${ch}"]`);
    if(!btn)continue;
    const cur = btn.classList.contains("correct")?"correct":btn.classList.contains("present")?"present":btn.classList.contains("absent")?"absent":null;
    const next = result[i];
    if(cur===null || KEY_RANK[next] > KEY_RANK[cur]){
      btn.classList.remove("correct","present","absent");
      btn.classList.add(next);
    }
  }
}

/* ============================================================
   9. STATS
   ============================================================ */
function finishGame(won){
  state.over=true; state.won=won;
  const st=getStats();
  st.played++;
  if(won){
    st.wins++;
    st.streak++;
    st.winStreakRun=(st.winStreakRun||0)+1;
    if(st.streak>st.best) st.best=st.streak;
    const guessesUsed = state.row;
    st.dist[guessesUsed] = (st.dist[guessesUsed]||0)+1;
  } else {
    st.streak=0;
    st.winStreakRun=0;
  }
  setStats(st);
  setLastMode(state.mode);

  if(won){
    winSparkles();
    pulseWinRow();
    let msg = WIN_MSGS[Math.floor(Math.random()*WIN_MSGS.length)];
    if((st.winStreakRun||0) >= 3) msg = `Blessing streak ×${st.winStreakRun}! ${msg}`;
    toast(msg);
  } else {
    toast("Take heart — try again");
  }
  setTimeout(()=>showResultModal(won, st), won? 900: 600);
}
function pulseWinRow(){
  const r=state.row-1;
  for(let c=0;c<state.length;c++){
    const t=document.getElementById(`tile-${r}-${c}`);
    if(!t)continue;
    setTimeout(()=>t.classList.add("win-pulse"), c*90);
  }
}

/* ============================================================
   10. SHARE
   ============================================================ */
function buildShareText(){
  const len=state.length;
  const modeLabel = {4:"Easy",5:"Classic",6:"Challenge"}[len] || "FaithWord";
  const tries = state.won ? state.row : "X";
  let txt = `FaithWord (${modeLabel}) ${tries}/6\n`;
  state.guesses.forEach(g=>{
    txt += g.result.map(r=> r==="correct"?"🟩":r==="present"?"🟨":"⬛").join("")+"\n";
  });
  return txt.trim();
}
function shareResult(){
  const txt = buildShareText();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast("Copied to clipboard"),()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  try{
    const ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    toast("Copied to clipboard");
  }catch(e){ toast("Copy not supported"); }
}

/* ============================================================
   11. MODAL / TOAST
   ============================================================ */
const toastEl=document.getElementById("toast");
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2200);
}
function showResultModal(won, st){
  const o=state.answerObj;
  document.getElementById("resultTitle").textContent = won ? (WIN_MSGS[0]) : "Keep Faith";
  document.getElementById("resAnswer").textContent = state.answer;
  document.getElementById("resCat").textContent = o.category;
  document.getElementById("resVerse").textContent = `"${o.hint}"  — ${o.verse}`;
  document.getElementById("resNote").textContent = o.note;
  document.getElementById("resCount").textContent = won ? `Solved in ${state.row} ${state.row===1?"guess":"guesses"}` : "The word was revealed";
  document.getElementById("msPlayed").textContent = st.played;
  document.getElementById("msWin").textContent = st.played? Math.round(st.wins/st.played*100)+"%" : "0%";
  document.getElementById("msCur").textContent = st.streak;
  document.getElementById("msBest").textContent = st.best;
  document.getElementById("overlay").classList.add("show");
}
function closeResult(){ document.getElementById("overlay").classList.remove("show"); }

function showStats(){
  const st=getStats();
  document.getElementById("stPlayed").textContent=st.played;
  document.getElementById("stWin").textContent=st.played?Math.round(st.wins/st.played*100)+"%":"0%";
  document.getElementById("stCur").textContent=st.streak;
  document.getElementById("stBest").textContent=st.best;
  const box=document.getElementById("distBox");
  box.innerHTML="";
  const maxV=Math.max(1,...Object.values(st.dist));
  for(let i=1;i<=6;i++){
    const v=st.dist[i]||0;
    const row=document.createElement("div");
    row.className="dist-row";
    const cur = (state.won && state.over && state.row===i) ? " cur":"";
    row.innerHTML=`<span class="num">${i}</span><div class="dist-bar${cur}" style="width:${Math.max(8,(v/maxV)*100)}%">${v}</div>`;
    box.appendChild(row);
  }
  document.getElementById("statsOverlay").classList.add("show");
}
function closeStats(){ document.getElementById("statsOverlay").classList.remove("show"); }

/* Sparkles on win */
function winSparkles(){
  const cx=window.innerWidth/2, cy=window.innerHeight/2.4;
  for(let i=0;i<26;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=cx+"px"; s.style.top=cy+"px";
    const ang=Math.random()*Math.PI*2, dist=80+Math.random()*180;
    s.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    s.style.setProperty("--dy",Math.sin(ang)*dist+"px");
    s.style.background = Math.random()>.5? "#f0c040":"#fff";
    document.body.appendChild(s);
    s.style.animation=`sparkleAnim ${700+Math.random()*500}ms ease-out forwards`;
    setTimeout(()=>s.remove(),1300);
  }
}

/* ============================================================
   HINT
   ============================================================ */
function toggleHint(){
  const box=document.getElementById("hintBox");
  if(state.hintShown){ box.classList.remove("show"); state.hintShown=false; return; }
  box.textContent = `Hint: ${state.answerObj.hint}  (${state.answerObj.category})`;
  box.classList.add("show");
  state.hintShown=true;
}

/* ============================================================
   GAME LIFECYCLE
   ============================================================ */
function pickLength(){
  if(state.mode==="mixed"){
    return [4,5,6][Math.floor(Math.random()*3)];
  }
  return MODE_LEN[state.mode];
}
function newGame(){
  closeResult();
  state.length = pickLength();
  state.answerObj = nextAnswer(state.length);
  state.answer = state.answerObj.word;
  state.guesses=[];
  state.current="";
  state.row=0;
  state.over=false;
  state.won=false;
  state.hintShown=false;
  document.getElementById("hintBox").classList.remove("show");
  renderBoard();
  renderKeyboard();
}
function giveUp(){
  if(state.over) return;
  state.over=true; state.won=false;
  // reveal answer row visually on next empty row
  const r=state.row;
  for(let c=0;c<state.length;c++){
    const t=document.getElementById(`tile-${r}-${c}`);
    if(!t)continue;
    t.querySelector(".face").textContent=state.answer[c];
    t.textContent=state.answer[c];
    t.classList.add("correct");
  }
  const st=getStats();
  st.played++; st.streak=0; st.winStreakRun=0;
  setStats(st);
  toast("The word is revealed");
  setTimeout(()=>showResultModal(false, getStats()),700);
}

function setMode(m){
  state.mode=m;
  document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  newGame();
}

/* ============================================================
   WIRING
   ============================================================ */
document.getElementById("modes").addEventListener("click",e=>{
  const b=e.target.closest(".mode-btn");
  if(b) setMode(b.dataset.mode);
});
document.getElementById("newBtn").addEventListener("click",newGame);
document.getElementById("statsBtn").addEventListener("click",showStats);
document.getElementById("hintBtn").addEventListener("click",toggleHint);
document.getElementById("shareBtn").addEventListener("click",()=>{ if(state.over) shareResult(); else toast("Finish the round to share"); });
document.getElementById("giveupBtn").addEventListener("click",giveUp);
document.getElementById("playAgainBtn").addEventListener("click",newGame);
document.getElementById("shareModalBtn").addEventListener("click",shareResult);
document.getElementById("closeModal").addEventListener("click",closeResult);
document.getElementById("closeStats").addEventListener("click",closeStats);
document.getElementById("closeStats2").addEventListener("click",closeStats);
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeResult(); });
document.getElementById("statsOverlay").addEventListener("click",e=>{ if(e.target.id==="statsOverlay") closeStats(); });

/* init */
state.mode = getLastMode();
document.querySelectorAll(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode));
newGame();
</script>
</body>
</html>
